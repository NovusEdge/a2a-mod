name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned to the oldest release with mods, so CI fails if the mod reaches
      # for API that only a newer Claude Code has.
      - name: Install Claude Code
        run: pnpm add -g @anthropic-ai/claude-code@2.1.287
      - run: pnpm check
      - run: pnpm test

  version:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: plugin.json and package.json carry one version
        run: test "$(jq -r .version .claude-plugin/plugin.json)" = "$(jq -r .version package.json)"
