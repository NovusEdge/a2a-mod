name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same version as types/vendor/claude-code.d.ts; bump both together.
      # npm, not pnpm: pnpm skips the postinstall that fetches the native binary.
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.288 && claude --version
      - run: pnpm check
      - run: pnpm test
      - run: pnpm e2e

  version:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: plugin.json and package.json carry one version
        run: test "$(jq -r .version .claude-plugin/plugin.json)" = "$(jq -r .version package.json)"
