name: pages

on:
  push:
    branches: [main]
    paths: ['docs/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/web/pnpm-lock.yaml
      - run: pnpm -C docs/web install --frozen-lockfile --ignore-workspace
      - run: pnpm -C docs/web build
      - run: pnpm -C docs/web check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web/build/client
      - id: deploy
        uses: actions/deploy-pages@v5
